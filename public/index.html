<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><script src="cf-shim.js"></script></head><body>
<title>SCEC Door Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: site-office tool. Top bar + tabs; plan viewer fills the screen; door record slides in as a drawer (full sheet on phones). */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#E4E9E7; --ink:#17201D; --muted:#5B6863; --line:#D3DAD7;
  --accent:#1F5FA8; --accent-ink:#FFFFFF; --accent-soft:#DCE7F5;
  --danger:#C2382E; --danger-soft:#F8E1DE; --ok:#23804F;
  --s0:#9AA5A0; --sA:#B9A3D6; --sB:#C9B45A; --s1:#E0A43A; --s2:#D9732B; --s3:#5B8FD1; --s4:#2F9E62; --s5:#145C3A;
  --paper:#FFFFFF; --plan-filter:none; --warn:#B4610C; --warn-soft:#FBEBD9;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 8px 28px rgba(16,28,24,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211F; --sunk:#141B19; --ink:#E3E9E6; --muted:#93A29C; --line:#2B3633;
  --accent:#78A9EA; --accent-ink:#0D1A2B; --accent-soft:#1E2E44;
  --danger:#F07468; --danger-soft:#3A1F1C; --ok:#5CC48C;
  --s0:#6B7873; --sA:#A98CD2; --sB:#CFBB63; --s1:#E8B04E; --s2:#E78B48; --s3:#7EA9E3; --s4:#4DBB7E; --s5:#7FD8A6;
  --paper:#F4F4F1; --plan-filter:invert(.9) hue-rotate(180deg); --warn:#F0A55A; --warn-soft:#3B2A17;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --sunk:#141B19; --ink:#E3E9E6; --muted:#93A29C; --line:#2B3633;
  --accent:#78A9EA; --accent-ink:#0D1A2B; --accent-soft:#1E2E44;
  --danger:#F07468; --danger-soft:#3A1F1C; --ok:#5CC48C;
  --s0:#6B7873; --sA:#A98CD2; --sB:#CFBB63; --s1:#E8B04E; --s2:#E78B48; --s3:#7EA9E3; --s4:#4DBB7E; --s5:#7FD8A6;
  --paper:#F4F4F1; --plan-filter:invert(.9) hue-rotate(180deg); --warn:#F0A55A; --warn-soft:#3B2A17;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;min-height:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
/* top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font:700 21px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
.prog{flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
.prog-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.prog-bar i{display:block;height:100%}
.prog-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.prog-legend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.kpis{display:flex;gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;background:var(--surface);text-align:left}
.kpi b{display:block;font:600 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi.alert b{color:var(--danger)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}
.role{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}.role.adm{background:var(--accent-soft);color:var(--accent)}
.team{background:var(--surface,#fff);color:var(--ink);border-radius:12px;padding:16px;max-width:640px;width:100%;margin:0 auto;overflow:auto;max-height:80vh}.team-t{width:100%;border-collapse:collapse;font-size:13px}.team-t th,.team-t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist li .del{margin-left:6px;font-size:11px;padding:0 6px;cursor:pointer;color:var(--danger,#b4232c);background:none;border:1px solid var(--line);border-radius:6px}
/* tabs */
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px 9px;font:600 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font:500 11px var(--f-mono);margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--sunk);color:var(--muted);letter-spacing:0}
.tabs .count.hot{background:var(--danger-soft);color:var(--danger)}
.banner{padding:8px 16px;font-size:13px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner[data-kind="warn"]{background:var(--danger-soft)}
main{flex:1;min-height:0;position:relative;display:flex}
.view{flex:1;min-width:0;min-height:0;display:flex}
/* plans */
.plans{flex-direction:row}
.dwgs{width:260px;flex:none;border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 0}
.dwgs h3,.sec-title{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 16px 8px}
.dwg{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 16px;border-left:3px solid transparent}
.dwg:hover{background:var(--sunk)}
.dwg[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.dwg .no{font:500 11px var(--f-mono);color:var(--muted)}
.dwg .t{display:block;font-weight:600;margin:1px 0 5px}
.mini{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--sunk)}
.mini i{display:block}
.dwg .c{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.viewer-wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.vtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.vtools select{max-width:100%}
.dwg-select{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="false"]{opacity:.45}
.spacer{flex:1}
.viewer{flex:1;position:relative;overflow:hidden;background:var(--sunk);touch-action:none;cursor:grab;min-height:240px}
.viewer.dragging{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}.pins .pin{pointer-events:auto;will-change:transform}
.stage img{display:block;max-width:none;background:var(--paper);filter:var(--plan-filter);user-select:none;-webkit-user-drag:none;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.pin{position:absolute;left:0;top:0;border:0;padding:0;background:none;transform-origin:0 0}
.pin i{display:flex;align-items:center;justify-content:center;gap:3px;transform:translate(-50%,-50%);min-width:16px;height:16px;border-radius:9px;background:var(--pc);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);font:600 10px/1 var(--f-mono);color:#fff;white-space:nowrap;padding:0}
.pin.lbl i{padding:0 6px;height:20px;font-size:11px}
.pin .flag{width:7px;height:7px;border-radius:50%;background:var(--danger);border:1px solid #fff}
.alertbox,.qbox,.prepbox{border-radius:var(--r);padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:3px;border:1px solid}
.alertbox{background:var(--danger-soft);border-color:var(--danger);color:var(--ink)}.alertbox b{color:var(--danger)}
.qbox{background:var(--warn-soft);border-color:var(--warn)}.prepbox{background:var(--accent-soft);border-color:var(--accent)}
.pin.alert i{box-shadow:0 0 0 3px var(--danger),0 1px 4px rgba(0,0,0,.45)}
.step:disabled{opacity:.45;cursor:not-allowed}
.pin.sel i{outline:3px solid var(--accent);outline-offset:2px}
.pin.stairbtn i{height:26px;padding:0 10px;border-radius:13px;background:var(--accent);color:#fff;font:700 12px var(--f-body);gap:6px;border:2px solid #fff}.pin.stairbtn small{background:rgba(255,255,255,.25);border-radius:8px;padding:0 5px;font:600 10px var(--f-mono)}
.pin.cluster i{min-width:24px;height:24px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;background:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 35%,transparent)}
.lvls{position:absolute;right:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);width:150px}
.lvls h5{margin:2px 4px 4px;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvls button{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink);text-align:left;cursor:pointer}
.lvls button:hover{background:var(--sunk)}.lvls button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink,var(--ink));font-weight:600}
.lvls button.go{background:var(--accent);color:#fff;font-weight:600;justify-content:center;margin-top:4px}
.lvls button .n{font:11px var(--f-mono);color:var(--muted)}.lvls .dw{display:flex;flex-wrap:wrap;gap:3px;padding:4px 4px 2px;border-top:1px solid var(--line);margin-top:3px}.lvls .dw button{padding:2px 6px;font:11px var(--f-mono);border:1px solid var(--line)}
.cl-pop{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;width:250px;font-size:12px}.cl-pop .btn{text-align:left;justify-content:flex-start}
.pin.hit i{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,95,168,.7)}100%{box-shadow:0 0 0 18px rgba(31,95,168,0)}}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:18px;box-shadow:var(--shadow)}
.dwg-meta{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;font:500 11px var(--f-mono);color:var(--muted);max-width:calc(100% - 90px)}
/* lists */
.panel-page{flex-direction:column;overflow:auto;padding:14px 16px 24px;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1;min-width:180px}
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
td.ref{font:600 13px var(--f-mono);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.fire{font:600 11px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--sunk);white-space:nowrap}
.fire.fr{background:var(--danger-soft);color:var(--danger)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h .ref{font:600 14px var(--f-mono);border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.card p{margin:0;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;background:var(--sunk);white-space:nowrap}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.green{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.kv div.diffv{color:var(--warn);font-weight:600}
.kv .was{display:block;font-weight:400;font-size:11px;color:var(--muted);text-decoration:line-through}
.check{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.check b{color:var(--warn)}
.check ul{margin:6px 0 0;padding-left:18px}
.iron{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.iron li{border-bottom:1px solid var(--line)}
.iron li:last-child{border-bottom:0}
.iron label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;font-size:13px;cursor:pointer}
.iron input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:var(--ok)}
.supbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.supbar span{font-size:12px;color:var(--muted);margin-right:4px}
.supbar button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 14px;font-weight:600;font-size:13px}
.supbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.supbar button .n{font:500 11px var(--f-mono);margin-left:6px;opacity:.75}
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 28px 7px 9px;white-space:nowrap}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:"▾";position:absolute;right:9px;top:7px;color:var(--muted)}
.ms .menu{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:180px}
.ms label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:13px;cursor:pointer;border-radius:4px}
.ms label:hover{background:var(--sunk)}
.section-sw{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.section-sw button{border:0;background:var(--surface);padding:6px 12px;font:600 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.section-sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);background:var(--surface)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.d-row{display:flex;align-items:center;gap:10px}
.d-ref{font:700 30px/1 var(--f-display);letter-spacing:.02em}
.d-sub{color:var(--muted);font-size:13px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:var(--r);font-size:18px}
.d-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.d-tabs button{border:0;background:none;padding:9px 10px;font:600 13px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.d-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.d-body{flex:1;overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;text-align:left}
.step .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--sc);display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);color:var(--sc);flex:none}
.step.done .n{background:var(--sc);color:#fff}
.step.cur{border-color:var(--sc);box-shadow:inset 3px 0 0 var(--sc)}
.step .lbl{font-weight:600}
.step .hint{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;min-width:0;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--muted);background:var(--sunk);font-size:12px}
.kv div:nth-last-child(-n+2){border-bottom:0}
.grp h4{margin:0 0 6px;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:8px;align-items:center}
.items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.items li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.items li:last-child{border-bottom:0}
.items .q{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.items .code{font:500 11px var(--f-mono);color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ph{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sunk);aspect-ratio:4/3;border:0;padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.form{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk)}
.form label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row>*{flex:1;min-width:130px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prodimgs{display:flex;flex-direction:column;gap:8px}
.prodimgs img{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.lightbox{position:fixed;inset:0;background:rgba(5,10,8,.9);z-index:40;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.lightbox .lb-top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:8px}
.lightbox .lb-top .x{background:#222;color:#fff;border-color:#444}
.lightbox .lb-img{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:none;cursor:grab;border-radius:6px}

.lightbox .lb-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}.lightbox .lb-zoom button{width:40px;height:40px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:50;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
@media (max-width:860px){

}
@media (prefers-reduced-motion:reduce){.pin.hit i{animation:none}}
.pill.batch{background:#5B3FA0;color:#fff}

<header class="top">
  <div class="brand"><b id="brand-t">Door Tracker</b><span>South Clyde Energy Centre · Fortum Glasgow</span></div>
  <div class="section-sw" id="section-sw" role="group" aria-label="Package"><button data-sec="doors" aria-pressed="true">Doors</button><button data-sec="louvres" aria-pressed="false">COLT louvres</button></div>
  <div class="prog" id="prog"></div>
  <div class="kpis" id="kpis"></div>
  <div class="who" id="who"></div>
</header>
<div class="supbar" id="supbar" role="group" aria-label="Supplier"></div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-v="plans" aria-selected="true">Plans</button>
  <button role="tab" data-v="doors" aria-selected="false" id="tab-sched">Door schedule</button>
  <button role="tab" data-v="defects" aria-selected="false">Defects <span class="count" id="c-def">0</span></button>
  <button role="tab" data-v="requests" aria-selected="false">Requests <span class="count" id="c-req">0</span></button>
</nav>
<div id="banner" class="banner" hidden></div>
<main>
  <section class="view plans" id="v-plans">
    <aside class="dwgs" id="dwgs"><h3>Drawings</h3><div id="dwg-list"><p class="muted" style="padding:0 16px">Loading drawings…</p></div></aside>
    <div class="viewer-wrap">
      <div class="vtools">
        <select id="dwg-select" class="dwg-select" aria-label="Drawing"></select>
        <div class="chips" id="status-chips"></div>
        <span class="spacer"></span>
        <input type="search" id="find" placeholder="Find door ref, e.g. DG04" aria-label="Find door" style="width:190px">
      </div>
      <div class="viewer" id="viewer">
        <div class="stage" id="stage"><img id="plan-img" alt="Plant layout drawing"></div>
        <div class="pins" id="pins"></div>
        <div class="dwg-meta" id="dwg-meta"></div>
        <div class="cl-pop" id="cl-pop" hidden></div>
        <div class="lvls" id="lvls" hidden></div>
        <div class="zoom"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">−</button><button id="z-fit" aria-label="Fit drawing" style="font-size:13px">Fit</button></div>
      </div>
    </div>
  </section>
  <section class="view panel-page" id="v-doors" hidden>
    <div class="filters">
      <input type="search" id="q" placeholder="Search ref, room, type, ironmongery…" aria-label="Search doors">
      <select id="f-status" aria-label="Status"><option value="">All stages</option></select>
      <select id="f-dwg" aria-label="Drawing"><option value="">All drawings</option></select>
      <select id="f-cons" aria-label="Construction"><option value="">All construction</option></select>
      <details class="ms" id="f-fire"><summary id="f-fire-s">All fire ratings</summary><div class="menu" id="f-fire-m"></div></details>
      <select id="f-diff" aria-label="Design check"><option value="">Any design check</option><option value="open">Open conflicts</option><option value="rev">Supplier to revise</option><option value="rfi">RFI open</option><option value="diff">Any conflict (incl. resolved)</option><option value="ok">Matches supplier design</option><option value="issue">Open site issues</option><option value="prep">Threshold / jamb prep notes</option><option value="levelq">Level to confirm</option><option value="prelim">Prelim design (not approved)</option><option value="approved">Design approved for construction</option></select>
      <button class="btn" id="export" hidden>Export CSV</button>
    </div>
    <div class="muted" id="door-count" style="font-size:12px"></div>
    <div class="tbl-wrap"><table><thead id="door-head"></thead><tbody id="door-rows"></tbody></table></div>
  </section>
  <section class="view panel-page" id="v-defects" hidden>
    <div class="filters">
      <div class="seg" id="def-seg"><button aria-pressed="true" data-v="Open">Open</button><button aria-pressed="false" data-v="Closed">Closed</button><button aria-pressed="false" data-v="">All</button></div>

      <div class="seg" id="req-seg"><button aria-pressed="true" data-v="active">Active</button><button aria-pressed="false" data-v="done">Done</button><button aria-pressed="false" data-v="">All</button></div>
      <select id="req-kind" aria-label="Request type"><option value="">All types</option><option value="access">Handover for connection</option><option value="lock">Suited lock / cylinder</option></select>
    </div>
    <div class="cards" id="req-list"></div>
  </section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Door record"></aside>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const STAGESETS={doors:[
 {k:"Not started",c:"--s0",hint:"Nothing on site yet"},
 {k:"Jamb prepared",c:"--sB",hint:"Reveal flashed / boarded, ready for frame"},
 {k:"Frame installed",c:"--s1",hint:"Frame fixed & packed"},
 {k:"Leaf hung",c:"--s2",hint:"Leaf hung, gaps checked"},
 {k:"Ironmongery fitted",c:"--s3",hint:"Per supplier design"},
 {k:"Complete",c:"--s4",hint:"Ready for inspection",done:1},
 {k:"Inspected",c:"--s5",hint:"Signed off",done:1}],
 louvres:[
 {k:"Not started",c:"--s0",hint:"Opening ready"},
 {k:"Subframe fixed",c:"--s1",hint:"Support steel / subframe"},
 {k:"Unit installed",c:"--s2",hint:"Louvre / vent fixed"},
 {k:"Flashings & sealed",c:"--s3",hint:"Weathered, mesh fitted"},
 {k:"Complete",c:"--s4",hint:"Ready for inspection",done:1},
 {k:"Inspected",c:"--s5",hint:"Signed off",done:1}]};
const DONE=c=>STAGES.reduce((n,x,i)=>n+(x.done?c[i]:0),0);
const DOORS_V=3;function migrate(col,o){if(col!=="doors"||(o.v||1)>=DOORS_V)return o;const v=o.v||1;const f=v===1?(x=>x>=1?x+1:x):(x=>x>=2?x-1:0);return {...o,v:DOORS_V,stage:typeof o.stage==="number"?f(o.stage):o.stage,hist:(o.hist||[]).map(h=>({...h,s:f(h.s)}))}}
const DESIGN={Approved:{t:"Design approved for construction",cls:"green"},Prelim:{t:"Prelim design (P-rev)",cls:"warn"},None:{t:"No supplier design",cls:""}};
function batchTxt(b){return b&&b.length?"Batch "+b.join(" + "):""}
function batchPill(d){if(UI.sec!=="doors"||!/almet/i.test(d.supplier||""))return"";return d.batch&&d.batch.length?`<span class="pill batch" title="Almet manufacturing batch${d.batch.length>1?" (issued in batch "+d.batch.join(", reissued in batch ")+")":""}">${batchTxt(d.batch)}</span>`:`<span class="pill" title="Not in Almet batch 1, 2 or 3">No batch</span>`}
function designPill(d){if(UI.sec!=="doors")return"";const x=DESIGN[d.design||"None"];return `<span class="pill ${x.cls}" title="${esc((d.designRevs||[]).length?"Drawing rev "+d.designRevs.join(", "):"")}">${x.t}</span>`}
let STAGES=STAGESETS.doors;
const SEC={doors:{one:"door",many:"doors",title:"Door Tracker",sched:"Door schedule",pcol:"doors"},louvres:{one:"louvre",many:"louvres",title:"COLT Louvres",sched:"Louvre schedule",pcol:"louvres"}};
const DEF_CATS=["Damage / finish","Gaps / alignment","Ironmongery","Seals / intumescent","Glazing","Signage","Frame / fixing","Other"];
const REQ_STATES=["Requested","Scheduled","Connected","Declined"];
const S={data:null,RAW:null,doors:new Map(),prog:{doors:new Map(),louvres:new Map()},defects:new Map(),requests:new Map(),photos:[],names:{}};
const UI={sup:"",fires:new Set(),sec:"doors",view:"plans",dwg:null,show:new Set(STAGES.map((_,i)=>i)),door:null,dtab:"progress",defSeg:"Open",reqSeg:"active",confirm:null,level:undefined};
let db=null,assets=null,userCap=null,downloads=null,meId=null,canWrite=true,live=false,photoUnsub=null,isOwner=false,users=new Map();
function isAdmin(){if(isOwner)return true;const u=meId&&users.get(meId);return !!(u&&u.role==="admin")}
function myRole(){return isOwner?"Owner":(meId&&users.get(meId)&&users.get(meId).role==="admin")?"Admin":canWrite?"Contributor":"Viewer"}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=v=>`var(${v})`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=t=>{if(!t)return"";const d=new Date(t);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function stageOf(ref){const d=S.doors.get(ref);return d&&typeof d.stage==="number"?d.stage:0}
const RES={"Accept supplier design":{cls:"green",t:"Supplier design accepted",done:1},"Schedule to be updated by RPS":{cls:"green",t:"RPS to update schedule",done:1},"No action – acceptable tolerance":{cls:"green",t:"Within tolerance",done:1},"Supplier to revise to schedule":{cls:"warn",t:"Supplier to revise",done:0},"Query / RFI raised":{cls:"warn",t:"RFI open",done:0}};
function openDiffs(d){return (d.diffs||[]).filter(x=>!(RES[x.res]&&RES[x.res].done))}
const MAINSUP=["Ascot","Almet","Johan"];
function supOk(d){if(UI.sec!=="doors"||!UI.sup)return true;return UI.sup==="Others"?!MAINSUP.includes(d.supplier):d.supplier===UI.sup}
function vis(){return Object.keys(S.data.doors).filter(r=>supOk(S.data.doors[r]))}
function renderSupbar(){const b=$("#supbar");if(UI.sec!=="doors"){b.hidden=true;return}b.hidden=false;const D=S.data.doors,all=Object.values(D);
  const n=k=>k===""?all.length:k==="Others"?all.filter(d=>!MAINSUP.includes(d.supplier)).length:all.filter(d=>d.supplier===k).length;
  b.innerHTML='<span>Supplier</span>'+["","Ascot","Almet","Johan","Others"].map(k=>`<button data-sup="${k}" aria-pressed="${UI.sup===k}">${k||"All"}<span class="n">${n(k)}</span></button>`).join("")}
function inSec(ref){return !!(S.data&&S.data.doors[ref])}
function openDefects(ref){let n=0;for(const d of S.defects.values())if(d.ref===ref&&d.status!=="Closed")n++;return n}
function activeReqs(ref){let n=0;for(const r of S.requests.values())if(r.ref===ref&&(r.status==="Requested"||r.status==="Scheduled"))n++;return n}
function name(id){if(!id)return"Someone";if(id===meId&&!S.names[id])return"You";return S.names[id]||"Someone"}
let nameQ=new Set(),nameT=null;
function want(id){if(id&&!(id in S.names)&&userCap){nameQ.add(id);clearTimeout(nameT);nameT=setTimeout(resolveNames,60)}}
async function resolveNames(){const ids=[...nameQ];nameQ.clear();if(!ids.length||!userCap)return;try{const ps=await userCap.profiles(ids);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||"";if(S.names[id]!==n){S.names[id]=n;ch=true}}if(ch)renderAll()}catch(e){}}

/* ---------- data writes (db when available, in-memory otherwise) ---------- */
async function put(col,id,data){
  if(col==="doors")data={...data,v:DOORS_V};
  if(db){await db.collection(col).doc(id).set(data)}
  else{(S.prog[col]||S[col]).set(id,{id,...data});renderAll()}
}
async function del(col,id){if(db)await db.collection(col).doc(id).delete();else{S[col].delete(id);renderAll()}}
function guard(){if(!canWrite){toast("You have view-only access to this tracker.");return false}return true}

/* ---------- boot ---------- */
async function boot(){
  bindStatic();
  try{const r=await fetch("data.json");S.RAW=await r.json()}catch(e){$("#dwg-list").innerHTML='<p class="muted" style="padding:0 16px">Drawing data could not be loaded. Reload the page.</p>';return}
  applySection("doors");
  const use=n=>window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  [db,userCap,assets,downloads]=await Promise.all([use("db"),use("user"),use("assets"),use("downloads")]);
  if(downloads)$("#export").hidden=false;
  if(userCap){try{meId=await userCap.id();const me=await userCap.me();if(me){$("#who").innerHTML=`<img alt="" src="${esc(me.avatarUrl)}"><span>${esc(me.name||"Signed in")}</span>`;if(me.id)S.names[me.id]=me.name||"";isOwner=!!me.isOwner;S.meAvatar=me.avatarUrl}}catch(e){}
    try{const c=await userCap.can("data.write");if(c===false)canWrite=false}catch(e){}}
  if(!db){banner("This view isn't connected to the shared tracker, so progress, defects and photos you add here won't be saved. Open the tracker from claude.ai while signed in.","warn")}
  else{
    live=true;
    if(!canWrite)banner("You have view-only access. Ask the tracker owner for Contributor access to update doors.");
    db.collection("users").onSnapshot(snap=>{users=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));renderWho();renderAll()},()=>{});
    db.collection("overrides").onSnapshot(snap=>{applyOverrides(snap.docs.map(d=>({id:d.id,...d.data()})));renderAll()},()=>{});
    for(const col of["doors","louvres","defects","requests"]){
      db.collection(col).onSnapshot(snap=>{const m=new Map(snap.docs.map(d=>[d.id,migrate(col,{id:d.id,...d.data()})]));if(col==="doors"||col==="louvres"){S.prog[col]=m;S.doors=S.prog[SEC[UI.sec].pcol]}else S[col]=m;renderAll()},e=>banner("Lost connection to the shared tracker ("+(e&&e.code||"error")+"). Reload the page to reconnect.","warn"));
    }
  }
}
function applySection(sec){
  UI.sec=sec;const R=S.RAW;STAGES=STAGESETS[sec];
  S.data={doors:sec==="doors"?R.doors:R.louvres,layouts:sec==="doors"?R.layouts:R.llayouts,hwsets:R.hwsets};
  S.doors=S.prog[SEC[sec].pcol];
  $("#brand-t").textContent=SEC[sec].title;$("#tab-sched").textContent=SEC[sec].sched;
  $("#section-sw").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sec===sec?"true":"false"));
  $("#find").placeholder=sec==="doors"?"Find door ref, e.g. DG04":"Find louvre ref, e.g. L17 or RV04";
  $("#f-diff").hidden=$("#f-cons").hidden=$("#f-fire").hidden=sec!=="doors";UI.fires.clear();
  if(UI.door)closeDoor();
  UI.dwg=S.data.layouts[0].id;UI.show=new Set(STAGES.map((_,i)=>i));
  fillFilters();renderAll();showDwg(UI.dwg,true);
}
function renderWho(){const w=$("#who");if(!userCap||!meId)return;const me=S.names[meId];const role=myRole();
  w.innerHTML=`${S.meAvatar?`<img alt="" src="${esc(S.meAvatar)}">`:""}<span>${esc(me||"Signed in")}</span><span class="role ${role==="Owner"||role==="Admin"?"adm":""}">${role}</span><button class="btn sm" id="team-btn">Team</button>`;$("#team-btn").onclick=openTeam;cfBadge()}
/* ---------- schedule overrides (admin) ---------- */
const OV_FIELDS=[["from","From room"],["to","To room"],["desc","Description"],["ctype","Construction"],["supplier","Supplier"],["fire","Fire rating"],["acoustic","Acoustics"],["soW","Structural opening width"],["soH","Structural opening height"],["clearW","Clear opening width"],["clearH","Clear opening height"],["finish","Door finish"],["vision","Vision panel"],["handles","Handles"],["lock","Lock / latch"],["access","Access control"],["hinges","Hinges"],["closer","Closer"],["kick","Kickplate"],["signage","Signage"],["comments","Comments"],["conn","Connection type (EL560 / Motorised / Controls / blank)"],["level","Level (metres, e.g. 8 or 12.4, or Roof)"],["note","Tracker note"]];
function applyOverrides(list){const R=S.RAW;if(!R)return;if(!R._base)R._base={};
  for(const ref in R._base){if(R.doors[ref])R.doors[ref]=R._base[ref]}
  R._base={};
  for(const o of list){const d=R.doors[o.id];if(!d||!o.f)continue;R._base[o.id]=d;R.doors[o.id]={...d,...o.f,ov:{by:o.by,at:o.at,keys:Object.keys(o.f)}}}
  if(UI.sec==="doors")S.data.doors=R.doors}
function ovForm(ref,d){const base=(S.RAW._base&&S.RAW._base[ref])||d;
  return `<div class="form" id="ov-form"><b>Edit schedule information (admin)</b><span class="muted" style="font-size:12px">Changes are stored as tracker overrides on top of the RPS schedule and shown to everyone. Clear a field to restore the schedule value.</span>
  ${OV_FIELDS.map(([k,l])=>`<label>${esc(l)}${d.ov&&d.ov.keys.includes(k)?' <span class="pill warn" style="font-size:10px">overridden</span>':""}<input type="text" data-ov="${k}" value="${esc(d[k]==null?"":d[k])}" placeholder="${esc(base[k]==null?"":base[k])}"></label>`).join("")}
  <div class="row"><button class="btn primary" id="ov-save">Save</button><button class="btn" id="ov-reset">Remove all overrides</button><button class="btn" id="ov-cancel">Cancel</button></div></div>`}
/* ---------- team dialog ---------- */
function openTeam(){const lb=$("#lightbox");lb.hidden=false;renderTeam()}
async function renderTeam(){if(window.__CF__)return renderTeamCF();const lb=$("#lightbox");const ids=[...users.keys()];if(meId&&!ids.includes(meId))ids.unshift(meId);ids.forEach(want);
  const adm=isAdmin();
  lb.innerHTML=`<div class="lb-top"><span style="flex:1">Team &amp; access</span><button class="x" id="lb-x" aria-label="Close">×</button></div>
  <div class="team"><p class="muted" style="margin:0 0 10px;font-size:13px">Everyone opens the tracker with their claude.ai sign-in. <b>Admins</b> can edit schedule information and delete installation-stage history. The artifact owner is always an admin. ${adm?"Search your organisation below to add people.":"Ask an admin to change roles."}</p>
  ${adm?`<label style="display:block;margin-bottom:10px">Add a person<input type="search" id="team-q" placeholder="Type a name…" autocomplete="off"></label><div id="team-hits"></div>`:""}
  <table class="team-t"><thead><tr><th>Person</th><th>Role</th><th></th></tr></thead><tbody>${ids.map(id=>{const u=users.get(id)||{};const role=u.role||"member";return `<tr><td>${esc(name(id))}${id===meId?' <span class="muted">(you)</span>':""}</td><td><span class="role ${role==="admin"?"adm":""}">${role==="admin"?"Admin":"Member"}</span></td><td style="text-align:right">${adm&&id!==meId?`<button class="btn sm" data-role="${id}" data-to="${role==="admin"?"member":"admin"}">${role==="admin"?"Make member":"Make admin"}</button> <button class="btn sm" data-rm="${id}">Remove</button>`:""}</td></tr>`}).join("")||'<tr><td colspan="3" class="muted">No one listed yet.</td></tr>'}</tbody></table></div>`;
  $("#lb-x").onclick=()=>{lb.hidden=true;lb.innerHTML=""};
  lb.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>save(()=>put("users",b.dataset.role,{role:b.dataset.to,by:meId,at:Date.now()}).then(renderTeam),"Role updated"));
  lb.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>save(()=>del("users",b.dataset.rm).then(renderTeam),"Removed"));
  const q=$("#team-q");if(q){const run=async()=>{const hits=await userCap.search(q.value);const box=$("#team-hits");box.innerHTML=hits.filter(h=>h.id!==meId&&!users.has(h.id)).map(h=>`<button class="btn sm" data-add="${esc(h.id)}" style="margin:0 6px 6px 0"></button>`).join("");
      box.querySelectorAll("[data-add]").forEach((b,i)=>{const h=hits.find(x=>x.id===b.dataset.add);b.textContent="+ "+(h.name||"Someone");S.names[h.id]=h.name||"";b.onclick=()=>save(()=>put("users",h.id,{role:"admin",by:meId,at:Date.now()}).then(()=>{q.value="";renderTeam()}),(h.name||"Person")+" added as admin")})};
    q.oninput=run;q.onfocus=run}}
/* ---------- team dialog (Cloudflare build: access requests, roles, access code) ---------- */
const CFJ=(u,o)=>fetch(u,Object.assign({credentials:"same-origin",headers:{"content-type":"application/json"}},o||{})).then(async r=>{if(!r.ok)throw new Error((await r.text())||r.statusText);return r.json()});
const ROLE_LBL={owner:"Owner",admin:"Admin",member:"Member",viewer:"Viewer",pending:"Requested",rejected:"Refused"};
let cfBadgeAt=0,cfBadgeN=0;async function cfBadge(){const b=$("#team-btn");if(!b||!window.__CF__||!isAdmin())return;const paint=n=>{b.textContent=n?`Team · ${n} request${n>1?"s":""}`:"Team";b.classList.toggle("primary",!!n)};if(Date.now()-cfBadgeAt<60000){paint(cfBadgeN);return}cfBadgeAt=Date.now();try{const ps=await CFJ("/api/admin/people");const n=cfBadgeN=ps.filter(p=>p.role==="pending"&&p.requested).length;paint(n)}catch(e){}}

function banner(msg,kind){const b=$("#banner");b.textContent=msg;b.dataset.kind=kind||"";b.hidden=false}

/* ---------- static bindings ---------- */
function bindStatic(){
  $("#supbar").addEventListener("click",e=>{const b=e.target.closest("[data-sup]");if(!b)return;UI.sup=b.dataset.sup;renderAll()});
  $("#f-fire-m").addEventListener("change",e=>{const c=e.target.closest("input[data-fire]");if(!c)return;c.checked?UI.fires.add(c.dataset.fire):UI.fires.delete(c.dataset.fire);$("#f-fire-s").textContent=UI.fires.size?[...UI.fires].join(", "):"All fire ratings";renderDoors()});
  document.addEventListener("click",e=>{const m=$("#f-fire");if(m.open&&!m.contains(e.target))m.open=false});
  $("#section-sw").addEventListener("click",e=>{const b=e.target.closest("[data-sec]");if(b&&b.dataset.sec!==UI.sec)applySection(b.dataset.sec)});
  $("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)setView(b.dataset.v)});
  ["#q","#f-status","#f-dwg","#f-cons","#f-diff"].forEach(s=>$(s).addEventListener("input",renderDoors));
  $("#def-q").addEventListener("input",renderDefects);
  $("#req-kind").addEventListener("input",renderRequests);
  $("#def-seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;UI.defSeg=b.dataset.v;segSet("#def-seg",b);renderDefects()});
  $("#req-seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;UI.reqSeg=b.dataset.v;segSet("#req-seg",b);renderRequests()});
  $("#door-rows").addEventListener("click",e=>{const tr=e.target.closest("tr[data-ref]");if(tr)openDoor(tr.dataset.ref)});

  $("#dwg-select").addEventListener("input",e=>showDwg(e.target.value,true));

  $("#export").addEventListener("click",exportCsv);
  $("#find").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.value.trim().toUpperCase();if(S.data.doors[r]){locate(r);openDoor(r)}else toast("No "+SEC[UI.sec].one+" "+r+" in this package. Try the other package switch.")}});

function normFire(f){if(!f)return"";if(/not fire|no ?fr|^nfr/i.test(f))return"No FR";f=f.toUpperCase().replace(/\s/g,"");return /^FD\d+$/.test(f)?f+"S":f}
function consOf(d){return d.ctype||""}

/* ---------- render ---------- */
function renderAll(){if(!S.data)return;renderHeader();renderDwgList();renderPins();
  if(UI.view==="doors")renderDoors();if(UI.view==="defects")renderDefects();if(UI.view==="requests")renderRequests();
  if(UI.door)renderDrawer()}
function counts(refs){const c=STAGES.map(()=>0);for(const r of refs)c[stageOf(r)]++;return c}
function bar(c,total,cls){return `<div class="${cls}">`+c.map((n,i)=>n?`<i style="width:${(n/total*100).toFixed(2)}%;background:${css(STAGES[i].c)}" title="${esc(STAGES[i].k)}: ${n}"></i>`:"").join("")+`</div>`}
function renderHeader(){
  renderSupbar();const refs=vis().filter(r=>!S.data.doors[r].unscheduled);const c=counts(refs);const tot=refs.length;
  $("#prog").innerHTML=bar(c,tot,"prog-bar")+`<div class="prog-legend">`+STAGES.map((s,i)=>`<span><i class="dot" style="background:${css(s.c)}"></i>${esc(s.k)} ${c[i]}</span>`).join("")+`</div>`;
  const done=DONE(c);let od=0;for(const d of S.defects.values())if(d.status!=="Closed"&&inSec(d.ref))od++;let ar=0;for(const r of S.requests.values())if((r.status==="Requested"||r.status==="Scheduled")&&inSec(r.ref))ar++;
  $("#kpis").innerHTML=`<div class="kpi"><b>${Math.round(done/tot*100)}%</b><span>${done}/${tot} done</span></div><div class="kpi ${od?"alert":""}"><b>${od}</b><span>Open defects</span></div><div class="kpi"><b>${ar}</b><span>Requests</span></div>`;

function renderDwgList(){
  let grp=null;const html=S.data.layouts.map(l=>{const refs=vis().filter(r=>S.data.doors[r].locs.some(p=>p.l===l.id));const c=counts(refs);const done=DONE(c);

    return head+`<button class="dwg" data-dwg="${l.id}" aria-current="${l.id===UI.dwg}"><span class="no">${l.kind==="level"?"Stitched plan":l.kind==="stair"?"Stair layout":l.id==="overall"?"A-1080 rev P02":(/^\d{4}$/.test(l.id)?"A-":"")+l.id+(l.rev?" rev "+esc(l.rev):"")}</span><span class="t">${esc(l.title)}</span>${bar(c,refs.length||1,"mini")}<div class="c">${done} of ${refs.length} ${SEC[UI.sec].many} complete</div></button>`}).join("");
  $("#dwg-list").innerHTML=html;$("#dwg-select").value=UI.dwg;
  $("#status-chips").innerHTML=STAGES.map((s,i)=>`<button class="chip" data-chip="${i}" aria-pressed="${UI.show.has(i)}"><i class="dot" style="background:${css(s.c)}"></i>${esc(s.k)}</button>`).join("");

/* ---------- plan viewer ---------- */
const view={s:1,tx:0,ty:0,w:1,h:1,fitted:false,min:.05,max:4};
function showDwg(id,doFit){UI.dwg=id;const L=S.data.layouts.find(l=>l.id===id);const img=$("#plan-img");view.w=L.w;view.h=L.h;img.width=L.w;img.height=L.h;
  if(img.getAttribute("src")!==L.file)img.src=L.file;
  $("#dwg-meta").textContent=L.kind?L.title+" · "+L.no:L.overall?"A-1080 P02 Site layout · all doors placed by gridline (upper floors shown at plan position) · click a numbered pin to zoom":L.no+(L.rev?" rev "+L.rev:"")+" · "+L.title;
  renderDwgList();renderLevels();renderPins();if(doFit){view.fitted=false;fit()}}
function fit(){const v=$("#viewer");const W=v.clientWidth,H=v.clientHeight;if(!W||!H)return;const s=Math.min(W/view.w,H/view.h)*.96;view.s=s;view.fitS=s;view.min=s*.6;view.tx=(W-view.w*s)/2;view.ty=(H-view.h*s)/2;view.fitted=true;apply()}
function apply(){$("#stage").style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  if(UI.dwg==="overall"&&clusterScale&&Math.abs(view.s-clusterScale)/clusterScale>.3){renderPins();return}
  const lbl=view.s>Math.min(.38,(view.fitS||.2)*1.7);
  for(const p of $("#pins").querySelectorAll(".pin")){p.style.transform=`translate(${(view.tx+p.dataset.x*view.s).toFixed(1)}px,${(view.ty+p.dataset.y*view.s).toFixed(1)}px)`;p.classList.toggle("lbl",lbl)}}
function zoomAt(f,cx,cy){const ns=Math.min(view.max,Math.max(view.min,view.s*f));const k=ns/view.s;view.tx=cx-(cx-view.tx)*k;view.ty=cy-(cy-view.ty)*k;view.s=ns;apply()}
let clusterScale=0;
function renderPins(){
  if(!S.data||!UI.dwg)return;const st=$("#pins");st.innerHTML="";hidePop();
  const frag=document.createDocumentFragment();const items=[];
  for(const[ref,d]of Object.entries(S.data.doors)){if(!supOk(d))continue;for(const p of d.locs){if(p.l!==UI.dwg)continue;if(UI.dwg==="overall"&&d.plan&&d.plan!=="lvG")continue;const s=stageOf(ref);if(!UI.show.has(s))continue;items.push({ref,x:p.x*view.w,y:p.y*view.h,s,via:p.via})}}
  const overall=UI.dwg==="overall"||/^lv/.test(UI.dwg);clusterScale=view.s;
  const mk=(it)=>{const b=document.createElement("button");b.className="pin"+(UI.door===it.ref?" sel":"")+(S.data.doors[it.ref].alert?" alert":"");b.dataset.ref=it.ref;b.dataset.x=it.x;b.dataset.y=it.y;b.style.setProperty("--pc",css(STAGES[it.s].c));
    const od=openDefects(it.ref);b.setAttribute("aria-label",`${it.ref}, ${STAGES[it.s].k}${od?", "+od+" open defects":""}${it.via&&it.via!=="5000"?", position from drawing "+it.via:""}`);
    b.innerHTML=`<i>${esc(it.ref)}${od?'<span class="flag"></span>':""}</i>`;return b};
  if(!overall){items.forEach(it=>frag.appendChild(mk(it)))}
  else{const R=24/Math.max(view.s,.01);const used=new Set();
    for(let i=0;i<items.length;i++){if(used.has(i))continue;const g=[i];for(let j=i+1;j<items.length;j++){if(used.has(j))continue;if(Math.hypot(items[j].x-items[i].x,items[j].y-items[i].y)<R){g.push(j);used.add(j)}}used.add(i);
      if(g.length===1){frag.appendChild(mk(items[i]));continue}
      const cx=g.reduce((a,k)=>a+items[k].x,0)/g.length,cy=g.reduce((a,k)=>a+items[k].y,0)/g.length;const tight=g.every(k=>Math.hypot(items[k].x-cx,items[k].y-cy)<6);
      const b=document.createElement("button");b.className="pin cluster";b.dataset.x=cx;b.dataset.y=cy;b.dataset.refs=g.map(k=>items[k].ref).join(",");b.dataset.tight=tight?"1":"";
      const low=Math.min(...g.map(k=>items[k].s));b.style.setProperty("--pc",css(STAGES[low].c));b.setAttribute("aria-label",`${g.length} doors here`);b.innerHTML=`<i>${g.length}</i>`;frag.appendChild(b)}}
  const curL=S.data.layouts.find(l=>l.id===UI.dwg);
  for(const bt of (curL&&curL.buttons)||[]){const n=Object.values(S.data.doors).filter(d=>d.plan===bt.to&&supOk(d)).length;const b=document.createElement("button");b.className="pin stairbtn";b.dataset.to=bt.to;b.dataset.x=bt.x*view.w;b.dataset.y=bt.y*view.h;b.setAttribute("aria-label",bt.label+" layout");b.innerHTML=`<i>${esc(bt.label)} \u203a<small>${n}</small></i>`;frag.appendChild(b)}
  st.appendChild(frag);apply()}
function bandOf(d){const L=S.RAW&&S.RAW.levels;if(!L||d.level==null)return null;const v=d.level==="Roof"?998:+d.level;if(isNaN(v))return null;const i=L.findIndex(x=>v>=x.lo&&v<x.hi);return i<0?null:i}
function renderLevels(){const el=$("#lvls");if(UI.sec!=="doors"){el.hidden=true;return}
  const Ls=S.data.layouts;const cur=Ls.find(l=>l.id===UI.dwg);if(!cur||!(cur.group==="Floor plans"||cur.group==="Stair cores")){el.hidden=true;return}
  const cnt=id=>vis().filter(r=>S.data.doors[r].plan===id).length;
  const lab=l=>l.id==="overall"?"Site layout":l.kind==="stair"?l.title.split(" –")[0]:l.id==="lvX"?"Other levels":l.title.replace(/^(First|Second|Third|Fourth) floor /,"").replace(/ –.*$/,"");
  const btn=l=>`<button data-godwg="${l.id}" aria-pressed="${l.id===UI.dwg}" title="${esc(l.title)}">${esc(lab(l))}<span class="n">${l.id==="overall"?cnt("lvG"):cnt(l.id)}</span></button>`;
  el.innerHTML=`<h5>Floor plans</h5>`+Ls.filter(l=>l.group==="Floor plans").map(btn).join("")+`<h5 style="margin-top:8px">Stair cores</h5>`+Ls.filter(l=>l.group==="Stair cores").map(btn).join("");
  el.hidden=false;el.querySelectorAll("[data-godwg]").forEach(b=>b.onclick=()=>showDwg(b.dataset.godwg,true))}
function hidePop(){const p=$("#cl-pop");if(p)p.hidden=true}
function clusterClick(b,e){const refs=b.dataset.refs.split(",");
  if(b.dataset.tight||view.s>=view.max*.9){const p=$("#cl-pop");const r=$("#viewer").getBoundingClientRect();p.innerHTML=`<b>${refs.length} doors at this location</b>`+refs.map(x=>{const d=S.data.doors[x];const v=(d.locs.find(l=>l.l==="overall")||{}).via;return `<button class="btn sm" data-pop="${esc(x)}">${esc(x)}<span class="muted"> ${esc(d.from||d.desc||"")}${v&&v!=="5000"?" · "+esc(v):""}</span></button>`}).join("");
    p.style.left=Math.min(r.width-260,Math.max(8,e.clientX-r.left+8))+"px";p.style.top=Math.min(r.height-200,Math.max(8,e.clientY-r.top+8))+"px";p.hidden=false;
    p.querySelectorAll("[data-pop]").forEach(x=>x.onclick=()=>{hidePop();openDoor(x.dataset.pop)})}
  else{const r=$("#viewer").getBoundingClientRect();zoomAt(2.4,e.clientX-r.left,e.clientY-r.top)}}
function initViewer(){
  const v=$("#viewer"),pts=new Map();let start=null,moved=0,pinch=null;
  v.addEventListener("pointerdown",e=>{if(e.target.closest(".lvls,.zoom,.cl-pop"))return;v.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    if(pts.size===1)start={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,target:e.target.closest(".pin")};
    if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,tx:view.tx,ty:view.ty,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}});
  v.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=v.getBoundingClientRect();
    if(pts.size===2&&pinch){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const ns=Math.min(view.max,Math.max(view.min,pinch.s*d/pinch.d));const k=ns/pinch.s;const cx=pinch.cx-r.left,cy=pinch.cy-r.top;
      const ncx=(a.x+b.x)/2-r.left,ncy=(a.y+b.y)/2-r.top;view.s=ns;view.tx=ncx-(cx-pinch.tx)*k;view.ty=ncy-(cy-pinch.ty)*k;moved=99;apply();return}
    if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>4){v.classList.add("dragging");view.tx=start.tx+dx;view.ty=start.ty+dy;apply()}}});
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);v.classList.remove("dragging");

    try{await put("defects",id,rec);if(f)await addPhoto(ref,f,"Defect: "+title,id);["df-title","df-detail"].forEach(k=>{const el=$("#"+k);if(el)el.value=""});toast("Defect reported on "+ref)}catch(e){toast("Couldn't save the defect: "+(e.message||e.code||"error"))}ds.disabled=false};
  const rk=$("#rq-kind");if(rk)rk.onclick=e=>{const b=e.target.closest("[data-k]");if(b){UI.reqKind={ref,k:b.dataset.k};renderDrawer()}};
  const rs=$("#rq-save");if(rs)rs.onclick=async()=>{if(!guard())return;const k=$("#rq-kind [aria-pressed=true]").dataset.k;rs.disabled=true;
    const rec={ref,kind:k,detail:$("#rq-detail").value.trim(),need:$("#rq-need").value||"",suite:k==="lock"?($("#rq-suite").value.trim()):"",status:"Requested",by:meId,at:Date.now()};
    try{await put("requests",uid(),rec);["rq-detail","rq-need","rq-suite"].forEach(x=>{const el=$("#"+x);if(el)el.value=""});toast((KIND[k])+" requested for "+ref)}catch(e){toast("Couldn't send the request: "+(e.message||e.code||"error"))}rs.disabled=false};
}
async function exifDate(file){try{const b=new DataView(await file.slice(0,131072).arrayBuffer());if(b.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<b.byteLength-4){const m=b.getUint16(o),len=b.getUint16(o+2);if(m===0xFFE1&&b.getUint32(o+4)===0x45786966){const t=o+10,le=b.getUint16(t)===0x4949;const g16=p=>b.getUint16(p,le),g32=p=>b.getUint32(p,le);
    const rd=(ifd,want)=>{const n=g16(t+ifd);for(let i=0;i<n;i++){const e=t+ifd+2+i*12;if(g16(e)===want)return g32(e+8)}return null};
    const str=p=>{let x="";for(let i=0;i<19;i++)x+=String.fromCharCode(b.getUint8(t+p+i));return x};
    const ifd0=g32(t+4);const ex=rd(ifd0,0x8769);let p=ex!=null?rd(ex,0x9003):null;if(p==null)p=rd(ifd0,0x0132);if(p==null)return null;
    const m2=str(p).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);return m2?new Date(+m2[1],m2[2]-1,+m2[3],+m2[4],+m2[5],+m2[6]).getTime():null}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return null}
async function addPhoto(ref,file,cap,defectId,item){
  const taken=(await exifDate(file))||file.lastModified||Date.now();
  const blob=await shrink(file,assets?1600:1280,assets?.8:.7,assets?6e5:200e3,ref+"  \u00b7  "+new Date(taken).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}));
  const rec={ref,cap:cap||"",by:meId,at:Date.now(),taken};if(defectId)rec.defect=defectId;if(item!=null)rec.item=String(item);
  if(assets){const r=await assets.upload(blob,{type:"image/jpeg"});rec.asset=r.id}
  else{rec.data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
  const id=uid();
  if(db)await db.collection("photos").doc(id).set(rec);else{S.photos.unshift({id,...rec});renderDrawer()}
}
async function shrink(file,max,q,limit,stamp){
  const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("not an image"));i.src=url});
    let w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    for(let tries=0;tries<6;tries++){const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext("2d");g.drawImage(img,0,0,c.width,c.height);
      if(stamp){const fs=Math.max(14,Math.round(c.width/45));g.font=`600 ${fs}px system-ui,sans-serif`;const tw=g.measureText(stamp).width;const pad=fs*.5;g.fillStyle="rgba(0,0,0,.6)";g.fillRect(c.width-tw-pad*3,c.height-fs-pad*3,tw+pad*2,fs+pad*2);g.fillStyle="#fff";g.textBaseline="top";g.fillText(stamp,c.width-tw-pad*2,c.height-fs-pad*2)}
      const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(b.size<=limit||tries===5)return b;k*=.8;q=Math.max(.5,q-.06)}}finally{URL.revokeObjectURL(url)}}
function lightbox(src,caption,photo){const lb=$("#lightbox");
  lb.innerHTML=`<div class="lb-top"><span style="flex:1;min-width:0">${esc(caption)}</span>${photo&&canWrite?`<button class="btn sm danger" id="lb-del">Delete photo</button>`:""}<button class="x" id="lb-x" aria-label="Close">×</button></div><div class="lb-img" id="lb-vp"><img alt="${esc(caption)}" src="${esc(src)}" draggable="false"><div class="lb-zoom"><button id="lb-zi" aria-label="Zoom in">+</button><button id="lb-zo" aria-label="Zoom out">\u2212</button><button id="lb-zf" aria-label="Fit" style="font-size:12px">Fit</button></div></div>`;
  lb.hidden=false;const close=()=>{lb.hidden=true;document.removeEventListener("keydown",onKey)};const onKey=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",onKey);$("#lb-x").onclick=close;
  zoomable($("#lb-vp"),lb.querySelector(".lb-img img"));
  const del=$("#lb-del");if(del)del.onclick=async()=>{if(!del.dataset.sure){del.dataset.sure="1";del.textContent="Tap again to delete";return}
    try{if(photo.asset&&assets)await assets.delete(photo.asset).catch(()=>{});await del_("photos",photo.id);lb.hidden=true;toast("Photo deleted")}catch(e){toast("Couldn't delete: "+(e.message||e.code))}}}
function zoomable(vp,img){const v={s:1,x:0,y:0,min:.05,max:8,fit:1};
  const ap=()=>{img.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.s})`};
  const fit=()=>{const W=vp.clientWidth,H=vp.clientHeight,w=img.naturalWidth||1,h=img.naturalHeight||1;v.fit=Math.min(W/w,H/h,1)*.98;v.s=v.fit;v.min=v.fit*.5;v.x=(W-w*v.s)/2;v.y=(H-h*v.s)/2;ap()};
  const zoomAt=(f,cx,cy)=>{const ns=Math.min(v.max,Math.max(v.min,v.s*f));const k=ns/v.s;v.x=cx-(cx-v.x)*k;v.y=cy-(cy-v.y)*k;v.s=ns;ap()};
  if(img.complete&&img.naturalWidth)fit();else img.onload=fit;
  const mid=f=>zoomAt(f,vp.clientWidth/2,vp.clientHeight/2);
  vp.querySelector("#lb-zi").onclick=()=>mid(1.5);vp.querySelector("#lb-zo").onclick=()=>mid(1/1.5);vp.querySelector("#lb-zf").onclick=fit;
  vp.querySelectorAll(".lb-zoom button").forEach(b=>b.addEventListener("pointerdown",e=>e.stopPropagation()));
  vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const pts=new Map();let st=null,pin=null,lastTap=0;
  vp.addEventListener("pointerdown",e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){st={x:e.clientX,y:e.clientY,vx:v.x,vy:v.y};const now=Date.now();if(now-lastTap<300){const r=vp.getBoundingClientRect();if(v.s>v.fit*1.05)fit();else zoomAt(2.5,e.clientX-r.left,e.clientY-r.top)}lastTap=now}
    if(pts.size===2){const[a,b]=[...pts.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y),s:v.s,x:v.x,y:v.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}});
  vp.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=vp.getBoundingClientRect();
    if(pts.size===2&&pin){const[a,b]=[...pts.values()];const ns=Math.min(v.max,Math.max(v.min,pin.s*Math.hypot(a.x-b.x,a.y-b.y)/pin.d));const k=ns/pin.s;const cx=pin.cx-r.left,cy=pin.cy-r.top;
      v.s=ns;v.x=cx-(cx-pin.x)*k+((a.x+b.x)/2-pin.cx);v.y=cy-(cy-pin.y)*k+((a.y+b.y)/2-pin.cy);ap()}
    else if(pts.size===1&&st){v.x=st.vx+e.clientX-st.x;v.y=st.vy+e.clientY-st.y;ap()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pin=null;if(pts.size===1){const p=[...pts.values()][0];st={x:p.x,y:p.y,vx:v.x,vy:v.y}}if(!pts.size)st=null};
  vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
  new ResizeObserver(()=>{if(Math.abs(v.s-v.fit)<1e-6)fit()}).observe(vp)}
async function del_(col,id){if(db)await db.collection(col).doc(id).delete();else{S.photos=S.photos.filter(p=>p.id!==id);renderDrawer()}}

async function exportCsv(){
  const cols=["Ref","From","To","Supplier","Type","Description","Construction","SO width","SO height","Fire","Access control","Lock/latch","Ironmongery set","Connection","Design status","Design conflicts","Drawings","Stage","Stage updated","Open defects","Active requests"];
  const q=v=>{v=v==null?"":String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[cols.join(",")];
  for(const[r,d]of filtered()){const st=S.doors.get(r)||{};lines.push([r,d.from,d.to,d.supplier,d.type,d.desc,d.construction,d.soW,d.soH,d.fire,d.access,d.lock,d.hw,d.conn,(DESIGN[d.design||"None"]||{}).t,(d.diffs||[]).map(x=>x.label+": supplier "+x.sup+" / schedule "+x.sch+(x.res?" ["+x.res+(x.comment?" – "+x.comment:"")+"]":"")).join("; "),[...new Set(d.locs.map(l=>l.l))].join(" "),STAGES[stageOf(r)].k,st.at?new Date(st.at).toISOString().slice(0,16).replace("T"," "):"",openDefects(r),activeReqs(r)].map(q).join(","))}
  try{await downloads.save({filename:`SCEC-${SEC[UI.sec].many}-progress-${new Date().toISOString().slice(0,10)}.csv`,data:lines.join("\n")})}catch(e){if(e&&e.code!=="declined"&&e.code!=="cancelled")toast("Export didn't complete: "+(e.code||e.message))}
}
